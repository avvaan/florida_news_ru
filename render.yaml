# Render Blueprint: сайт + база + задача по расписанию.
# Render → New → Blueprint → выберите репозиторий. Секреты (sync: false) введёте в панели.
databases:
  - name: florida-db
    plan: basic-256mb
    databaseName: florida
    user: florida

envVarGroups:
  - name: florida-shared
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Сигналы из соцсетей (включаются галочками в админке)
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      # Сверьте названия моделей командой `python manage.py check_ai` и поправьте здесь.
      - key: AI_CLASSIFIER_MODEL
        value: deepseek-flash
      - key: AI_VERIFIER_MODEL
        value: deepseek-flash
      - key: AI_WRITER_MODEL
        value: deepseek-v4-pro

services:
  - type: web
    name: florida-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /robots.txt
    envVars:
      - fromGroup: florida-shared
      - key: DATABASE_URL
        fromDatabase: { name: florida-db, property: connectionString }
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: cron
    name: florida-pipeline
    runtime: python
    plan: starter
    schedule: "7 11,22 * * *"        # дважды в день: 11:07 и 22:07 UTC = 7:07 и 18:07 во Флориде (летом; зимой на час раньше)
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_pipeline
    envVars:
      - fromGroup: florida-shared
      - key: DATABASE_URL
        fromDatabase: { name: florida-db, property: connectionString }
      - key: PYTHON_VERSION
        value: "3.12.7"
