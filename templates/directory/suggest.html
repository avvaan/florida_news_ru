<aside class="dir__suggest" aria-labelledby="suggest-h">
  <h3 id="suggest-h">Ваш бизнес — в справочник</h3>
  <p>Владельцы и представители бизнеса могут добавить себя сами: бесплатно, проверка автоматическая и занимает пару минут. Знаете хорошее место, но это не ваш бизнес — напишите нам.</p>
  <p class="dir__suggest-actions">
    <a class="btn btn--sun" href="{% url 'directory:submit' %}{% if category and category.kind == 'business' %}?category={{ category.pk }}{% endif %}">Добавить бизнес</a>
    {% if contact_email %}<a class="btn btn--ghost" href="mailto:{{ contact_email }}?subject={{ 'Предложить бизнес для справочника'|urlencode }}">Написать на почту</a>{% endif %}
    <a class="btn btn--ghost" href="{% url 'core-page' 'contacts' %}">Контакты редакции</a>
  </p>
</aside>
