<div class="dir-form__field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="dir-form__help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="dir-form__field-error">{{ e }}</p>{% endfor %}
</div>
