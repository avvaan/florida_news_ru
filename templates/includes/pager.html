{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Страницы">
  {% if page_obj.has_previous %}<a class="btn btn--ghost" href="?page={{ page_obj.previous_page_number }}" rel="prev">← Новее</a>{% endif %}
  <span class="pager__num">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn--ghost" href="?page={{ page_obj.next_page_number }}" rel="next">Ещё новости →</a>{% endif %}
</nav>
{% endif %}
