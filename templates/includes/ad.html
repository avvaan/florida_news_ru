{% load i18n %}<aside class="promo{% if wide %} promo--wide{% endif %}" aria-label="{% translate "Реклама" %}">
  <span class="promo__label">{% translate "Реклама" %} · {{ ad.advertiser }}</span>
  <a class="promo__link" href="{{ ad.url }}" target="_blank" rel="sponsored noopener">
    {% if ad.image %}<img src="{{ ad.image.url }}" alt="{{ ad.headline|default:ad.advertiser }}" loading="lazy">
    {% else %}<span class="promo__text">{{ ad.headline }}</span>{% endif %}
  </a>
</aside>
