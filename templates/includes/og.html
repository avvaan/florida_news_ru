{% load static news_extras %}{# Open Graph и Twitter: title, description, url, image (путь в static без расширения или URL), type, image_alt #}
  <meta property="og:type" content="{{ type|default:'website' }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ url|absolute }}">
  {% if image %}{% with img=image|add:".jpg" %}<meta property="og:image" content="{% static img as og_img %}{{ og_img|absolute }}">{% endwith %}{% else %}<meta property="og:image" content="{% static 'covers/florida.jpg' as og_img %}{{ og_img|absolute }}">{% endif %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="{{ image_alt|default:title }}">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
